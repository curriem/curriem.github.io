---
layout: default
---
<main>
  <article class="post">
    <header class="post-header">
      <p class="post-meta">{{ page.date | date: "%Y-%m-%d" }}</p>
      <h1>{{ page.title }}</h1>
    </header>
    <div class="post-body">
      {{ content }}
    </div>
    <p class="post-back"><a href="/writing/">← All writing</a></p>
  </article>
</main>
